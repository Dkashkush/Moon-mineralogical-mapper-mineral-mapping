[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunacorder"
version = "0.1.2"
description = "Tetracorder-style mineral identification for Chandrayaan-1 Moon Mineralogy Mapper (M3) data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["moon", "M3", "hyperspectral", "mineralogy", "tetracorder", "planetary science", "remote sensing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["numpy>=1.23", "scipy>=1.9", "pyyaml>=6", "matplotlib>=3.6"]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
dev = ["pytest>=7", "ruff==0.15.8", "rasterio>=1.3"]

[project.scripts]
lunacorder = "lunacorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lunacorder = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "RUF"]
# En dashes and micro signs in docstrings/labels are intentional
ignore = ["RUF001", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["lunacorder", "synthetic"]
